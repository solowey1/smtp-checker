name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для публикации, например v1.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Версия в package.json совпадает с тегом
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Тег $tag не совпадает с версией package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm test
      - run: npx --yes typescript@latest --noEmit --strict --lib es2022 index.d.ts
      - run: npm pack --dry-run

  publish-npmjs:
    name: Publish to npmjs.com
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # нужен для npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Публикация
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::Секрет NPM_TOKEN не задан — публикация в npmjs.com пропущена."
            exit 0
          fi
          npm publish

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Пакет для GitHub Packages
        run: |
          # GitHub Packages принимает только имена, ограниченные областью владельца
          # репозитория, поэтому переименовываем пакет прямо перед публикацией.
          # В npmjs.com он остаётся под коротким именем smtp-checker.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          npm pkg set name="@$owner/smtp-checker"
          # provenance поддерживает только npmjs.com.
          npm pkg delete publishConfig.provenance

      - name: Публикация
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

  github-release:
    name: GitHub Release
    needs: [verify, publish-npmjs, publish-github-packages]
    if: ${{ always() && needs.verify.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Создать релиз
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
