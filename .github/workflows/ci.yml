name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: node --test test/unit.test.js test/integration.test.js
      - name: CLI smoke test
        run: |
          node bin/smtp-checker.js --version
          node bin/smtp-checker.js --list
          node bin/smtp-checker.js --help
          node bin/smtp-checker.js -u ci@gmail.com --dry-run --json
